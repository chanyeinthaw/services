name: services-friday

services:
  friday:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRIDAY_VERSION: ${FRIDAY_VERSION:-v0.0.0-nightly.2}
        FRIDAY_TARGET: ${FRIDAY_TARGET:-linux-x64}
    image: local/friday:${FRIDAY_VERSION:-v0.0.0-nightly.2}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /home/friday
      FRIDAY_HOME: /home/friday/.friday
      GH_CONFIG_DIR: /home/friday/.config/gh
      PI_SETUP_DIR: /home/friday/.pi/agent
    volumes:
      - ./data/home/friday:/home/friday/.friday
      - ./data/home/pi:/home/friday/.pi
      - ./data/home/gh:/home/friday/.config/gh
      - ./data/home/ssh:/home/friday/.ssh
      - ./secrets/runtime:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /home/friday/.friday/friday.sqlite && pgrep -x friday >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
