[unix_http_server]
file=/home/friday/.friday/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/home/friday/.friday/run/supervisord.pid
childlogdir=/home/friday/.friday/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/friday/.friday/run/supervisor.sock

[program:friday]
command=/usr/local/bin/friday-run
directory=/home/friday
autostart=true
autorestart=unexpected
startsecs=10
startretries=4
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/home/friday/.friday/logs/supervisor-friday.stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/friday/.friday/logs/supervisor-friday.stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HOME="/home/friday",FRIDAY_HOME="/home/friday/.friday"
