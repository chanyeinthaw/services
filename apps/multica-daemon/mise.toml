[tools]
# Keep these versions explicit so a rebuilt runtime is reproducible. Update
# deliberately when changing the runtime toolchain.
node = "26.7.0"
bun = "1.3.14"
"npm:pnpm" = "10.33.0"
go = "1.26.5"
pi = "0.84.1"

[env]
_.path = [
  "{{config_root}}/.local/share/mise/installs/node/26.7.0/bin",
  "{{config_root}}/.local/share/mise/installs/bun/1.3.14/bin",
  "{{config_root}}/.local/share/mise/installs/npm-pnpm/10.33.0/bin",
  "{{config_root}}/.local/share/mise/installs/go/1.26.5/bin",
  "{{config_root}}/.local/share/mise/installs/pi/0.84.1/pi",
  "{{config_root}}/.local/share/mise/installs/pi/0.84.1",
]
