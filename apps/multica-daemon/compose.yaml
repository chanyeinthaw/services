name: services-multica-daemon

services:
  runtime:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
      args:
        MULTICA_REPOSITORY: ${MULTICA_REPOSITORY:-git@github.com:chanyeinthaw/multica.git}
        MULTICA_COMMIT: ${MULTICA_COMMIT:-4dd2a04031ce32200212aeb960d14adec30d2e44}
        MULTICA_VERSION: ${MULTICA_VERSION:-v0.4.21-17-g4dd2a0403}
        MULTICA_COMMIT_SHORT: ${MULTICA_COMMIT_SHORT:-4dd2a0403}
        MULTICA_BUILD_DATE: ${MULTICA_BUILD_DATE:-unknown}
    image: local/multica-runtime:feat-pi-thinking-model-resolution
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOME: /home/multica
      MISE_DATA_DIR: /home/multica/.local/share/mise
      PATH: /home/multica/.local/share/mise/installs/node/26.7.0/bin:/home/multica/.local/share/mise/installs/bun/1.3.14/bin:/home/multica/.local/share/mise/installs/npm-pnpm/10.33.0/node_modules/.bin:/home/multica/.local/share/mise/installs/go/1.26.5/bin:/home/multica/.local/share/mise/installs/pi/0.84.1/pi:/home/multica/.local/share/mise/installs/pi/0.84.1:/home/multica/.local/bin:/home/multica/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      MISE_CONFIG_DIR: /home/multica/.config/mise
      MISE_CACHE_DIR: /home/multica/.cache/mise
      GH_CONFIG_DIR: /home/multica/.config/gh
      PI_SETUP_DIR: /home/multica/.pi/agent
      MULTICA_PI_PATH: /usr/local/bin/pi
      MULTICA_WORKSPACES_ROOT: /workspace
      SSH_PORT: "22"
      TAILSCALE_SOCKET: /run/tailscale/tailscaled.sock
      # Forward the host SSH agent so GitHub SSH repositories can be cloned
      # without copying a private key into the container.
      SSH_AUTH_SOCK: /run/host-ssh-agent
    ports:
      # The .env binds this to the host's Tailscale IP. Use 127.0.0.1 if you
      # prefer SSH access only through a local tunnel.
      - "${SSH_BIND_ADDRESS:-127.0.0.1}:${SSH_PUBLISHED_PORT:-55222}:22"
    volumes:
      # Task worktrees and their repositories survive container recreation.
      - ./data/workspace:/workspace
      # Persist CLI auth/config and daemon identity.
      - ./data/home/multica:/home/multica/.multica
      # Persist Pi setup, settings, packages, and auth state.
      - ./data/home/pi:/home/multica/.pi
      # Persist GitHub CLI authentication and configuration separately.
      - ./data/home/gh:/home/multica/.config/gh
      # Persist the runtime user's SSH authorized_keys and known_hosts.
      - ./data/home/ssh:/home/multica/.ssh
      # Forward the host SSH agent for GitHub SSH clones.
      - ${SSH_AGENT_SOCKET:-/run/user/1000/gcr/ssh}:/run/host-ssh-agent:ro
      # Persist Tailscale node identity when Tailscale is enabled.
      - ./data/tailscale:/var/lib/tailscale
      # Persist SSH host keys across recreation.
      - ./data/ssh-host-keys:/etc/ssh/host-keys
      # Optional read-only host public keys. The entrypoint imports these.
      - ${OXYGEN_SSH_PUBLIC_KEY_FILE:-/home/chan/Services/apps/multica-daemon/secrets/oxygen.pub}:/run/host-keys/oxygen.pub:ro
      - ${SILICON_SSH_PUBLIC_KEY_FILE:-/home/chan/.ssh/id_ed25519.pub}:/run/host-keys/silicon.pub:ro
    # Required only when Tailscale is enabled. The container needs a TUN
    # device and network administration capability for its own node namespace.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:19514/health | grep -q '\"status\":\"running\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
