name: services-buzz

services:
  relay:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_SERVE_GIT_WEB_GUI: "true"
    ports:
      - "127.0.0.1:${BUZZ_HTTP_PORT:-8331}:3000"
    volumes:
      - ./data/git:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
      '

  aaron:
    build:
      context: ./agent
      args:
        OPENCODE_VERSION: "1.18.2"
    image: local/buzz-aaron:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
      - ./secrets/aaron.env
    environment:
      HOME: /home/node
      XDG_CONFIG_HOME: /home/node/.config
      XDG_DATA_HOME: /home/node/.local/share
      XDG_STATE_HOME: /home/node/.local/state
      XDG_CACHE_HOME: /home/node/.cache
      BUZZ_RELAY_URL: wss://buzz.tailcd7ccb.ts.net
      BUZZ_ACP_AGENT_COMMAND: opencode
      BUZZ_ACP_AGENT_ARGS: acp
      BUZZ_ACP_AGENTS: "1"
      BUZZ_ACP_MODEL: internal/gpt-5.6-sol
      BUZZ_ACP_RESPOND_TO: allowlist
      BUZZ_ACP_RESPOND_TO_ALLOWLIST: ${OWNER_PUBLIC_KEY}
      BUZZ_ACP_AGENT_OWNER: ${OWNER_PUBLIC_KEY}
      BUZZ_ACP_SUBSCRIBE: mentions
      BUZZ_ACP_NO_MENTION_FILTER: "true"
      BUZZ_ACP_CONTEXT_MESSAGE_LIMIT: "20"
      BUZZ_ACP_MAX_TURNS_PER_SESSION: "50"
      BUZZ_ACP_IDLE_TIMEOUT: "620"
      BUZZ_ACP_MAX_TURN_DURATION: "7200"
      BUZZ_ACP_HEARTBEAT_INTERVAL: "300"
      BUZZ_ACP_SYSTEM_PROMPT_FILE: /config/AARON.md
      BUZZ_ACP_PERMISSION_MODE: bypass-permissions
      OPENCODE_CONFIG: /config/opencode.json
      MYSQL_HOST: mysql.database.internal
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: development
      MYSQL_USER: developer
      MYSQL_PASSWORD: dev-mysql
      POSTGRES_HOST: pg.database.internal
      POSTGRES_PORT: "5432"
      POSTGRES_DB: development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-postgres
      REDIS_HOST: redis.cache.internal
      REDIS_PORT: "6379"
      REDIS_PASSWORD: dev-redis
      MYSQL_URL: mysql://developer:dev-mysql@mysql.database.internal:3306/development
      POSTGRES_URL: postgresql://postgres:dev-postgres@pg.database.internal:5432/development
      CACHE_REDIS_URL: redis://:dev-redis@redis.cache.internal:6379
    volumes:
      - ./data/aaron/workspace:/workspace
      - ./data/aaron/home:/home/node
      - ./agent/config:/config:ro
      - ./secrets/gh:/home/node/.config/gh:ro
    network_mode: host
    depends_on:
      relay:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 8g
    cpus: 4
